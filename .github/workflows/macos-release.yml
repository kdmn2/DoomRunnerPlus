name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to attach the package to (defaults to current ref)"
        required: false
        type: string

jobs:
  dmg:
    name: DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 builds natively on an Apple Silicon runner.
          - runner: macos-14
            arch: arm64
          # x86_64 needs a native Intel runner (macos-13). If GitHub retires it,
          # switch to an Apple Silicon runner + cross-build instead.
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out into a dir named `DoomRunner` so PROJECT_NAME (basename of
          # SOURCE_DIR) matches the executable TARGET (DoomRunner).
          path: DoomRunner

      - name: Install dependencies
        working-directory: DoomRunner
        run: brew install qt minizip

      - name: Build and package (.dmg)
        working-directory: DoomRunner
        run: |
          ./Scripts/1-build.sh ${{ matrix.arch }} dynamic plain release
          # shellcheck disable=SC1091
          source /tmp/DoomRunner/build_vars.sh
          ./Scripts/2-package.sh "$BUILD_DIR" MacOS ${{ matrix.arch }} dmg

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DoomRunner/Releases/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
