name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to attach the package to (defaults to current ref)"
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Checked out into a dir named `DoomRunner` so the scripts' PROJECT_NAME
      # (basename of SOURCE_DIR) matches the executable TARGET (DoomRunner).
      WINDOWS_BUILD_DIR: ${{ github.workspace }}\DoomRunner\Builds\Windows-recent-static-release

    steps:
      - uses: actions/checkout@v4
        with:
          path: DoomRunner

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-minizip
            python

      - name: Install 7-Zip
        shell: powershell
        run: choco install 7zip --no-progress -y

      - name: Build (static Qt, release)
        shell: msys2 {0}
        working-directory: DoomRunner
        run: |
          cmd.exe //c "Scripts\\1-build.bat recent static release"

      - name: Package (static_exe)
        shell: msys2 {0}
        working-directory: DoomRunner
        run: |
          cmd.exe //c "Scripts\\2-package.bat \"$WINDOWS_BUILD_DIR\" recent static_exe"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DoomRunner/Releases/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
