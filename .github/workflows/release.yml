name: Build release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to attach the packages to (must exist, e.g. v1.0)"
        required: false
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# Grant the GITHUB_TOKEN write permission so it can create/update the GitHub release.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux AppImage (Steam Deck-compatible, built on Ubuntu 24.04 in a container)
  # ---------------------------------------------------------------------------
  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: DoomRunner
      - name: Build AppImage
        working-directory: DoomRunner
        run: bash Packaging/appimage-docker/build.sh
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DoomRunner/Releases/*.AppImage
          overwrite: true
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Windows (MSYS2 UCRT64, static Qt6 -> static_exe zip)
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_BUILD_DIR: ${{ github.workspace }}\DoomRunner\Builds\Windows-recent-static-release
    steps:
      - uses: actions/checkout@v4
        with:
          path: DoomRunner
      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-minizip
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-lerc
            mingw-w64-ucrt-x86_64-jbigkit
            mingw-w64-ucrt-x86_64-libdeflate
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-graphite2
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-libb2
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-double-conversion
            mingw-w64-ucrt-x86_64-giflib
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libpsl
            mingw-w64-ucrt-x86_64-libidn2
            mingw-w64-ucrt-x86_64-nghttp2
            python
      - name: Install 7-Zip
        shell: powershell
        run: choco install 7zip --no-progress -y
      - name: Build (static Qt, release)
        shell: msys2 {0}
        working-directory: DoomRunner
        run: cmd.exe //c "Scripts\\1-build.bat recent static release"
      - name: Package (static_exe)
        shell: msys2 {0}
        working-directory: DoomRunner
        run: cmd.exe //c "Scripts\\2-package.bat \"$WINDOWS_BUILD_DIR\" recent static_exe"
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DoomRunner/Releases/*.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS (native DMG per architecture)
  # ---------------------------------------------------------------------------
  macos:
    name: DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: DoomRunner
      - name: Install dependencies
        working-directory: DoomRunner
        run: brew install qt minizip
      - name: Build and package (.dmg)
        working-directory: DoomRunner
        run: |
          ./Scripts/1-build.sh ${{ matrix.arch }} dynamic plain release
          # shellcheck disable=SC1091
          source /tmp/DoomRunner/build_vars.sh
          ./Scripts/2-package.sh "$BUILD_DIR" MacOS ${{ matrix.arch }} dmg
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: DoomRunner/Releases/*.dmg
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
